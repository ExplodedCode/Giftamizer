<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Giftamizer promo</title>
<script src="icons.js"></script>
<style>
@font-face { font-family: Inter; src: url(inter.woff2) format('woff2'); font-weight: 100 900; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #fafafa; font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; }
#root { position: absolute; inset: 0; overflow: hidden; }
#bg, #snow, #fx { position: absolute; inset: 0; width: 100%; height: 100%; }
#stage { position: absolute; inset: 0; perspective: 2600px; }
.phone { position: absolute; left: 0; top: 0; transform-style: preserve-3d; will-change: transform; }
.bezel { position: absolute; inset: 0; background: #0b0b0d; box-shadow: 0 0 0 2px #3a3a40 inset, 0 0 0 1px #17171a, 0 60px 120px -30px rgba(6, 78, 59, .38), 0 24px 60px -20px rgba(0, 0, 0, .28); }
.screen { position: absolute; overflow: hidden; background: #fff; }
.screen canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
.island { position: absolute; background: #000; border-radius: 999px; }
.homebar { position: absolute; background: rgba(9, 9, 11, .85); border-radius: 99px; }
.cap { position: absolute; display: flex; flex-direction: column; }
.eyebrow { display: inline-flex; align-items: center; align-self: flex-start; gap: .5em; border-radius: 99px; font-weight: 650; white-space: nowrap; }
.eyebrow svg { width: 1.2em; height: 1.2em; }
.h { font-weight: 800; letter-spacing: -.035em; line-height: 1.04; color: #09090b; }
.h .w { display: inline-block; white-space: pre; will-change: transform, opacity; }
.sub { font-weight: 500; letter-spacing: -.012em; line-height: 1.3; color: #5b5b66; }
.tag { position: absolute; display: flex; align-items: center; gap: .55em; background: #fff; border-radius: 99px; font-weight: 700; letter-spacing: -.01em; color: #09090b; box-shadow: 0 18px 44px -12px rgba(0, 0, 0, .26), 0 0 0 1px rgba(0, 0, 0, .05); white-space: nowrap; will-change: transform, opacity; }
.tag svg { width: 1.15em; height: 1.15em; }
.tag img { border-radius: 50%; object-fit: cover; }
#logo { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
#logo .mark { position: absolute; }
#logo .word { position: absolute; width: 100%; text-align: center; color: #fff; font-weight: 750; letter-spacing: -.04em; }
#logo .line { position: absolute; width: 100%; text-align: center; color: rgba(255, 255, 255, .92); font-weight: 600; letter-spacing: -.02em; line-height: 1.2; }
#logo .cta { position: absolute; left: 50%; display: flex; align-items: center; justify-content: center; gap: .5em; background: #fff; color: #047857; border-radius: 28px; font-weight: 750; letter-spacing: -.02em; box-shadow: 0 24px 60px -16px rgba(0, 0, 0, .35); white-space: nowrap; }
</style>
</head>
<body>
<div id="root">
	<canvas id="bg"></canvas>
	<div id="stage"></div>
	<div id="tags"></div>
	<div id="caps"></div>
	<canvas id="snow"></canvas>
	<div id="logo"></div>
	<canvas id="fx"></canvas>
</div>
<script type="module" src="comp.js"></script>
</body>
</html>
