<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Giftamizer thumbnail</title>
<script src="icons.js"></script>
<style>
@font-face { font-family: Inter; src: url(inter.woff2) format('woff2'); font-weight: 100 900; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100vw; height: 100vh; overflow: hidden; font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; }
body { position: relative; background: radial-gradient(1100px 900px at 78% 40%, #10b981 0%, rgba(16, 185, 129, 0) 70%), linear-gradient(155deg, #04a777 0%, #059669 38%, #065f46 100%); }
canvas { position: absolute; inset: 0; }
.brand { position: absolute; left: 96px; top: 86px; display: flex; align-items: center; gap: 24px; color: #fff; font-size: 74px; font-weight: 750; letter-spacing: -.035em; }
.brand svg { width: 92px; height: 92px; }
h1 { position: absolute; left: 88px; top: 290px; color: #fff; font-size: 206px; line-height: .95; font-weight: 850; letter-spacing: -.055em; }
h1 em { font-style: normal; color: #fcd34d; }
.pts { position: absolute; left: 96px; top: 790px; display: flex; flex-direction: column; gap: 22px; }
.pt { display: flex; align-items: center; gap: 24px; color: #fff; font-size: 60px; font-weight: 700; letter-spacing: -.028em; white-space: nowrap; }
.pt i { display: flex; align-items: center; justify-content: center; width: 70px; height: 70px; border-radius: 50%; background: #fff; color: #059669; }
.pt svg { width: 44px; height: 44px; stroke-width: 3.4; }
.phone { position: absolute; border-radius: 92px; background: #0b0b0d; box-shadow: inset 0 0 0 3px #3a3a40, 0 70px 130px -30px rgba(0, 0, 0, .55), 0 24px 60px -18px rgba(0, 0, 0, .4); }
.screen { position: absolute; inset: 20px; border-radius: 74px; overflow: hidden; background: #fff; }
.screen img { position: absolute; left: 0; width: 100%; display: block; }
.island { position: absolute; left: 50%; top: 34px; width: 158px; height: 44px; margin-left: -79px; border-radius: 99px; background: #000; }
.tag { position: absolute; display: flex; align-items: center; gap: 20px; background: #fff; color: #09090b; border-radius: 99px; font-size: 52px; font-weight: 750; letter-spacing: -.025em; padding: 22px 40px 22px 30px; white-space: nowrap; box-shadow: 0 30px 70px -18px rgba(0, 0, 0, .5); }
.tag svg { width: 56px; height: 56px; stroke-width: 2.6; }
/* vertical cover for the Short: words stay inside the middle 888px, clear of the Shorts buttons */
@media (orientation: portrait) {
	body { background: radial-gradient(900px 900px at 60% 62%, #10b981 0%, rgba(16, 185, 129, 0) 70%), linear-gradient(165deg, #04a777 0%, #059669 40%, #065f46 100%); }
	.brand { left: 96px; top: 190px; font-size: 70px; }
	.brand svg { width: 86px; height: 86px; }
	h1 { left: 90px; top: 338px; font-size: 180px; }
	.pts { display: none; }
}
</style>
</head>
<body>
<canvas id="snow" ></canvas>
<div class="brand"><span id="mark" style="display:flex"></span>Giftamizer</div>
<h1>Gift giving,<br /><em>sorted.</em></h1>
<div class="pts">
	<div class="pt"><i class="ck"></i>Wishlists, groups, Secret Santa</div>
	<div class="pt"><i class="ck"></i>No duplicate gifts</div>
</div>
<canvas id="conf" ></canvas>
<div class="phone" id="p2"><div class="screen"><img alt="" /></div><div class="island"></div></div>
<div class="phone" id="p1"><div class="screen"><img alt="" /></div><div class="island"></div></div>
<div class="tag" id="t1"></div>
<script type="module">
const GIFT = 'M314.6,155.9l45.4,77.2h-1.7h-93.9c-28.8,0-52.2-23.3-52.2-52.2s23.3-52.2,52.2-52.2h2.9 C286.7,128.8,304.8,139.1,314.6,155.9z M149.6,180.9c0,18.8,4.6,36.5,12.5,52.2h-54.2c-23.1,0-41.7,18.6-41.7,41.7v83.5 c0,23.1,18.6,41.7,41.7,41.7h584.2c23.1,0,41.7-18.6,41.7-41.7v-83.5c0-23.1-18.6-41.7-41.7-41.7h-54.2c8-15.6,12.5-33.4,12.5-52.2 c0-63.4-51.4-114.7-114.7-114.7h-2.9c-41.6,0-80.2,22-101.3,57.9L400,177.7l-31.4-53.5c-21.1-36-59.7-58-101.3-58h-2.9 C201,66.2,149.6,117.6,149.6,180.9z M587.8,180.9c0,28.8-23.3,52.2-52.2,52.2h-93.9H440l45.4-77.2c9.9-16.8,27.9-27.1,47.3-27.1h2.9 C564.4,128.8,587.8,152.1,587.8,180.9z M107.9,441.7v229.5c0,34.6,28,62.6,62.6,62.6h187.8V441.7H107.9z M441.7,733.8h187.8 c34.6,0,62.6-28,62.6-62.6V441.7H441.7V733.8z';
document.getElementById('mark').innerHTML = `<svg viewBox="0 0 800 800" fill="#fff"><path d="${GIFT}"/></svg>`;
for (const e of document.querySelectorAll('.ck')) e.innerHTML = ICONS.check;
document.getElementById('t1').innerHTML = `<span style="color:#e11d48;display:flex">${ICONS.shuffle}</span>You got Ben!`;

// screens chosen because they show people and lists, not branded products
const V = innerHeight > innerWidth;
for (const c of document.querySelectorAll('canvas')) {
	c.width = innerWidth;
	c.height = innerHeight;
}
const place = async (id, clip, frame, x, y, w, rot) => {
	const c = await (await fetch(`/clips/${clip}/clip.json`)).json();
	const p = document.getElementById(id);
	const h = w * (844 / 390) + 10;
	Object.assign(p.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px', transform: `rotate(${rot}deg)` });
	const img = p.querySelector('img');
	const sw = w - 40;
	img.style.top = (sw / 390) * 44 + 'px';
	img.src = `/clips/${clip}/${String(c.map[frame]).padStart(5, '0')}.jpg`;
	await img.decode();
};
await document.fonts.load('850 40px Inter');
await document.fonts.load('750 40px Inter');
await place('p2', 'groups', 20, ...(V ? [560, 900, 480, 10] : [1520, 250, 470, 11]));
await place('p1', 'santa', 660, ...(V ? [140, 790, 580, -5] : [1172, 92, 560, -5]));

const rnd = (s) => {
	const x = Math.sin(s * 127.1 + 311.7) * 43758.5453;
	return x - Math.floor(x);
};
const s = document.getElementById('snow').getContext('2d');
for (let i = 0; i < 90; i++) {
	s.globalAlpha = 0.12 + 0.4 * rnd(i + 5);
	s.fillStyle = '#fff';
	s.beginPath();
	s.arc(rnd(i + 1) * innerWidth, rnd(i + 2.2) * innerHeight, 3 + rnd(i + 3) * 8, 0, 7);
	s.fill();
}
// confetti around the phones only, kept off the words
const g = document.getElementById('conf').getContext('2d');
const col = ['#fbbf24', '#f59e0b', '#fb7185', '#ffffff', '#34d399', '#7dd3fc'];
for (let i = 0; i < 70; i++) {
	const a = rnd(i + 0.4) * Math.PI * 2;
	const r = 430 + rnd(i + 0.9) * 260;
	const x = (V ? 540 : 1470) + Math.cos(a) * r * 0.86;
	const y = (V ? 1250 : 470) + Math.sin(a) * r * 0.8;
	if (!V && (x < 1040 || y > 900 || (x < 1120 && y > 740))) continue;
	if (V && y < 780) continue;
	g.save();
	g.translate(x, y);
	g.rotate(i * 1.3);
	g.fillStyle = col[i % col.length];
	const k = 15 + rnd(i + 0.2) * 17;
	if (i % 3) g.fillRect(-k / 2, -k * 0.3, k, k * 0.6);
	else {
		g.beginPath();
		g.arc(0, 0, k * 0.42, 0, 7);
		g.fill();
	}
	g.restore();
}
const t = document.getElementById('t1');
Object.assign(t.style, { left: V ? '70px' : '1046px', top: V ? '1328px' : '628px', transform: 'rotate(-5deg)' });
window.READY = true;
</script>
</body>
</html>
